<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bumerán">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#2a1d14">
  <title>Mando · Bumerán de Juguete</title>
  <!-- Abierto desde un icono de la pantalla de inicio, el mando ocupa toda la pantalla -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/controller.css">
  <!-- three se usa para dibujar los retratos de los personajes -->
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/" } }
  </script>
</head>
<body>
  <header class="bar">
    <span class="swatch" id="swatch"></span>
    <span class="name" id="player-name">Conectando…</span>
    <div class="abilities" id="abilities" hidden></div>
    <span class="status" id="status" data-state="connecting">Conectando</span>
    <button class="change-btn" id="change-btn" type="button" hidden>👤 Cambiar</button>
    <span class="ping" id="ping"></span>
    <button class="fullscreen" id="fullscreen-btn" type="button" hidden>⛶</button>
  </header>

  <main class="pad">
    <section class="stick-zone" id="stick-zone">
      <div class="stick-hint">Arrastra aquí para moverte</div>
      <div class="stick-base" id="stick-base">
        <div class="stick-knob" id="stick-knob"></div>
      </div>
    </section>
    <section class="action-zone">
      <button class="dash-btn" id="dash-btn" type="button"><span>DASH</span></button>
      <div class="aim-stick" id="aim-stick">
        <div class="aim-base" id="aim-base">
          <div class="aim-knob" id="aim-knob"></div>
        </div>
        <span class="aim-label" id="action-label">LANZAR</span>
        <small class="aim-hint" id="action-hint">arrastra y suelta: lanzar · toca: cuchillada</small>
      </div>
    </section>
  </main>

  <!-- Elección de personaje: hay que elegir uno y pulsar JUGAR para entrar en la sala -->
  <div class="select-screen" id="select-screen" hidden>
    <h1>Elige tu juguete</h1>
    <div class="char-grid" id="char-grid"></div>
    <p class="select-message" id="select-message"></p>
    <button class="play-btn" id="play-btn" type="button" disabled>Elige un personaje</button>
  </div>

  <!-- Power-ups: explicación al tocar un icono y aviso al coger uno nuevo -->
  <div class="ability-info" id="ability-info" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <div class="ios-hint" id="ios-hint" hidden>
    <p><strong>Pantalla completa en iPhone:</strong> pulsa <b>Compartir</b> (el cuadrado con la flecha) → <b>Añadir a pantalla de inicio</b>, y abre el mando desde ese icono.</p>
    <button type="button" id="ios-hint-close">Entendido</button>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-box">
      <p id="overlay-text"></p>
      <button type="button" id="overlay-btn">Reintentar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/protocol.js"></script>
  <script src="/shared/powerups.js"></script>
  <script src="/shared/characters.js"></script>
  <script type="module" src="/js/controller/main.js"></script>
</body>
</html>
