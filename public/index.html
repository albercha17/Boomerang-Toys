<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bumerán de Juguete</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/game.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "cannon-es": "/vendor/cannon/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>

  <header class="hud">
    <span class="hud-title">BUMERÁN DE JUGUETE</span>
    <div class="hud-players" id="hud-players"></div>
    <button class="hud-btn hud-start" id="start-btn" type="button" title="Tecla Intro">▶ Empezar</button>
    <button class="hud-btn" id="map-btn" type="button" title="Tecla M">Nuevo mapa</button>
    <button class="hud-btn" id="bot-btn" type="button" title="Tecla B">+ Añadir bot</button>
    <button class="hud-btn" id="pause-btn" type="button" title="Tecla P o Esc" hidden>Ⅱ Pausa</button>
    <span class="hud-url" id="hud-url"></span>
  </header>

  <!-- Sala, cuenta atrás, resultados, victoria y pausa (ui/MatchOverlay.js) -->
  <div class="match-overlay" id="match-overlay"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/protocol.js"></script>
  <script type="module" src="/js/game/main.js"></script>
</body>
</html>
